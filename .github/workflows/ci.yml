name: CI

on:
  push:
    branches: [ main ]
  pull_request:

jobs:
  test:
    name: Build and test
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '21'
          cache: maven

      # The runner's Docker 29 refuses clients older than API 1.44, while the Testcontainers version managed by
      # Spring Boot 3.3 (1.19) still asks for 1.32. Every Testcontainers test then fails with "Could not find a
      # valid Docker environment". This tells its Docker client to use API 1.44.
      - name: Let Testcontainers talk to the runner's Docker
        run: echo "api.version=1.44" > ~/.docker-java.properties

      - name: Show Docker version
        run: docker version

      # Integration tests start real PostgreSQL containers via Testcontainers
      # (Docker is preinstalled on GitHub's Ubuntu runners).
      - name: Build and run tests
        run: mvn -B -ntp verify

      - name: Upload test reports on failure
        if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: surefire-reports
          path: target/surefire-reports

  docker:
    name: Docker images build
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Build images
        run: docker compose build
