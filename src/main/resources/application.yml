server:
  # Hosting platforms (Render, Railway, ...) tell the app which port to use through PORT.
  port: ${PORT:8080}

spring:
  application:
    name: jobqueue
  datasource:
    url: ${DB_URL:jdbc:postgresql://localhost:5432/jobqueue}
    username: ${DB_USER:jobqueue}
    password: ${DB_PASSWORD:jobqueue}
  flyway:
    enabled: true

management:
  endpoints:
    web:
      exposure:
        include: health,info,prometheus

jobqueue:
  worker:
    enabled: false
    # Per-job-type concurrency limits (optional). Types not listed have no limit.
    # Example:
    # type-concurrency:
    #   SEND_EMAIL: 3
    #   SLOW: 1

  # API key authentication (optional). When enabled, every request must carry a valid X-Api-Key header.
  # Manage keys via POST /api/admin/keys (protected by the admin password, if set).
  # apikeys:
  #   enabled: true

  # Admin HTTP Basic password for write operations (optional).
  # admin:
  #   password: ${JOBQUEUE_ADMIN_PASSWORD:}

